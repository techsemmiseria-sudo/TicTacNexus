<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicTac Arena - Firebase</title>
  <style>
    :root {
      --bg: #0a0a14; --bg-2: #12122a; --cyan: #00f0ff; --magenta: #ff2bd6;
      --amber: #ffb347; --gold: #ffd700; --text: #e8e8ff; --muted: #7a7a9e;
      --error: #ff5577;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: radial-gradient(ellipse at top, var(--bg-2), var(--bg));
      color: var(--text); min-height: 100vh; display: flex; align-items: center;
      justify-content: center; overflow-x: hidden; position: relative;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(0,240,255,0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0,240,255,0.05) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none; animation: gridMove 20s linear infinite;
    }
    @keyframes gridMove { from { background-position: 0 0; } to { background-position: 40px 40px; } }

    .tela { display: none; flex-direction: column; align-items: center; gap: 24px; padding: 20px; animation: fadeIn 0.5s ease; width: 100%; max-width: 500px; }
    .tela.ativa { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem); text-align: center;
      background: linear-gradient(90deg, var(--cyan), var(--magenta));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      letter-spacing: 4px; text-shadow: 0 0 40px rgba(0,240,255,0.3); font-weight: 900;
    }
    .btn {
      background: transparent; border: 2px solid var(--cyan); color: var(--cyan);
      padding: 14px 32px; font-size: 1rem; letter-spacing: 2px; cursor: pointer;
      transition: all 0.3s; text-transform: uppercase; font-weight: 600; width: 100%; max-width: 250px;
    }
    .btn:hover { background: var(--cyan); color: var(--bg); box-shadow: 0 0 30px var(--cyan); transform: translateY(-2px); }
    .btn.magenta { border-color: var(--magenta); color: var(--magenta); }
    .btn.magenta:hover { background: var(--magenta); box-shadow: 0 0 30px var(--magenta); color: var(--bg); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    input {
      background: rgba(255,255,255,0.05); border: 2px solid var(--muted); color: var(--text);
      padding: 12px 18px; font-size: 1.2rem; letter-spacing: 4px; text-align: center;
      text-transform: uppercase; width: 100%; max-width: 250px; transition: all 0.3s;
    }
    input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 20px rgba(0,240,255,0.3); }

    .codigo-sala {
      font-size: 3rem; color: var(--gold); letter-spacing: 8px;
      text-shadow: 0 0 20px var(--gold); padding: 20px 40px;
      border: 2px dashed var(--gold); animation: pulse 2s infinite; font-weight: 900; 
      user-select: all; cursor: pointer; text-align: center;
    }
    @keyframes pulse { 50% { opacity: 0.7; } }

    .tabuleiro {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      width: min(90vw, 350px); aspect-ratio: 1; padding: 12px;
      background: rgba(0,0,0,0.4); border: 2px solid rgba(0,240,255,0.3);
      border-radius: 12px; box-shadow: 0 0 60px rgba(0,240,255,0.15), inset 0 0 30px rgba(0,0,0,0.5);
    }
    .celula {
      background: rgba(255,255,255,0.03); border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s; position: relative;
      min-height: 80px;
    }
    .celula:hover:not(.ocupada):not(.bloqueada) { background: rgba(0,240,255,0.1); transform: scale(1.03); }
    .celula.bloqueada { cursor: not-allowed; }

    .peca { width: 70%; height: 70%; stroke-width: 8; fill: none; stroke-linecap: round; }
    .peca.X { stroke: var(--cyan); filter: drop-shadow(0 0 8px var(--cyan)); }
    .peca.O { stroke: var(--magenta); filter: drop-shadow(0 0 8px var(--magenta)); }
    .peca.animar { stroke-dasharray: 200; stroke-dashoffset: 200; animation: desenhar 0.4s ease forwards; }
    @keyframes desenhar { to { stroke-dashoffset: 0; } }

    .celula.vencedora { animation: shake 0.5s ease; }
    .celula.vencedora .peca { filter: drop-shadow(0 0 20px var(--gold)) drop-shadow(0 0 40px var(--gold)); }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px) rotate(-2deg); } 75% { transform: translateX(8px) rotate(2deg); } }

    .hud { display: flex; justify-content: space-between; width: min(90vw, 350px); gap: 12px; }
    .placar-item { flex: 1; text-align: center; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.03); }
    .placar-item.X { border: 1px solid var(--cyan); }
    .placar-item.O { border: 1px solid var(--magenta); }
    .placar-item.E { border: 1px solid var(--amber); }
    .placar-item .rotulo { font-size: 0.7rem; color: var(--muted); letter-spacing: 2px; }
    .placar-item .valor { font-size: 1.8rem; margin-top: 4px; font-weight: 900; }
    .placar-item.X .valor { color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
    .placar-item.O .valor { color: var(--magenta); text-shadow: 0 0 10px var(--magenta); }
    .placar-item.E .valor { color: var(--amber); }

    .status { font-size: 1.1rem; letter-spacing: 2px; min-height: 30px; font-weight: 600; text-align: center; }
    .erro { color: var(--error); font-size: 0.9rem; min-height: 20px; text-align: center; font-weight: bold; padding: 10px; background: rgba(255,85,119,0.1); border-radius: 8px; border: 1px solid var(--error); }
    .info-conexao { background: rgba(0,240,255,0.1); border: 1px solid var(--cyan); padding: 12px 20px; border-radius: 8px; font-size: 0.9rem; color: var(--cyan); text-align: center; width: 100%; }
    .alerta { background: rgba(255,179,71,0.1); border: 1px solid var(--amber); color: var(--amber); padding: 12px; border-radius: 8px; font-size: 0.85rem; text-align: center; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; animation: fadeIn 0.3s; }
    .modal.ativo { display: flex; }
    .modal-conteudo { background: var(--bg-2); border: 2px solid var(--cyan); padding: 40px; border-radius: 16px; text-align: center; box-shadow: 0 0 80px rgba(0,240,255,0.4); animation: popIn 0.5s cubic-bezier(.17,.67,.35,1.5); max-width: 90%; }
    @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal h2 { font-size: 2.5rem; margin-bottom: 20px; letter-spacing: 4px; font-weight: 900; }
    .modal h2.vitoria { background: linear-gradient(90deg, var(--gold), var(--amber)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .modal h2.empate { color: var(--amber); }

    .particula { position: fixed; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; animation: explodir 1s ease-out forwards; }
    @keyframes explodir { to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
    
    .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: var(--cyan); animation: spin 1s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="tela-inicio" class="tela ativa">
    <h1>TICTAC ARENA</h1>
    <p style="color: var(--muted); letter-spacing: 2px; text-align: center;">MULTIPLAYER • FIREBASE REALTIME</p>
    
    <div id="firebase-status" class="alerta" style="display:none;"></div>
    
    <input type="text" id="nick-criar" placeholder="Seu nickname" maxlength="12">
    <button class="btn" id="btn-criar">⚡ Criar Sala</button>
    <div style="height: 10px;"></div>
    <input type="text" id="nick-entrar" placeholder="Seu nickname" maxlength="12">
    <input type="text" id="codigo-input" placeholder="CÓDIGO (4 letras)" maxlength="4">
    <button class="btn magenta" id="btn-entrar"> Entrar na Sala</button>
    <div id="erro" class="erro" style="display:none;"></div>
  </div>

  <div id="tela-lobby" class="tela">
    <h2 style="letter-spacing: 3px; font-weight: 900;">SALA CRIADA</h2>
    <p style="color: var(--muted); text-align: center;">Compartilhe o código com seu oponente:</p>
    <div id="codigo-sala" class="codigo-sala" title="Clique para copiar">----</div>
    <div class="info-conexao" id="status-conexao">Aguardando oponente conectar...</div>
    <button class="btn magenta" id="btn-cancelar" style="margin-top:10px;"> Cancelar</button>
  </div>

  <div id="tela-jogo" class="tela">
    <div class="hud">
      <div class="placar-item X"><div class="rotulo">X</div><div class="valor" id="placar-x">0</div></div>
      <div class="placar-item E"><div class="rotulo">EMP</div><div class="valor" id="placar-e">0</div></div>
      <div class="placar-item O"><div class="rotulo">O</div><div class="valor" id="placar-o">0</div></div>
    </div>
    <div id="status" class="status">Preparando...</div>
    <div id="tabuleiro" class="tabuleiro"></div>
    <div id="erro-jogo" class="erro" style="display:none;"></div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-conteudo">
      <h2 id="modal-titulo">RESULTADO</h2>
      <div style="display: flex; gap: 12px; margin-top: 20px; justify-content: center; flex-wrap: wrap;">
        <button class="btn" id="btn-revanche">🔁 Revanche</button>
        <button class="btn magenta" id="btn-sair">🚪 Sair</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, update, onValue, onDisconnect, get, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBaSvWpKNqXn6ZaJHoLtSV0NMPZQBBf5LQ",
      authDomain: "tictac2-11eee.firebaseapp.com",
      databaseURL: "https://tictac2-11eee-default-rtdb.firebaseio.com",
      projectId: "tictac2-11eee",
      storageBucket: "tictac2-11eee.firebasestorage.app",
      messagingSenderId: "82467678084",
      appId: "1:82467678084:web:82f681d1d5b1ff606edfd1"
    };

    let db = null;
    let dbErro = false;
    
    // Testar conexão Firebase
    try {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
      
      // Testar se consegue escrever
      const testRef = ref(db, '.info/connected');
      onValue(testRef, (snapshot) => {
        if (snapshot.val() === true) {
          document.getElementById('firebase-status').style.display = 'none';
          console.log('✅ Firebase conectado!');
        }
      });
      
      setTimeout(() => {
        if (!dbErro) {
          console.log('Firebase inicializado');
        }
      }, 2000);
      
    } catch (error) {
      dbErro = true;
      console.error('❌ Erro Firebase:', error);
      const statusEl = document.getElementById('firebase-status');
      statusEl.style.display = 'block';
      statusEl.innerHTML = '⚠️ Erro de conexão com Firebase. Verifique:<br>1. Se o Realtime Database está criado<br>2. Se as regras estão em "Test Mode"<br>3. Console (F12) para detalhes';
    }

    // Estado do jogo
    let currentRoomId = null;
    let mySymbol = null;
    let gameData = null;
    let modalMostrado = false;
    let salaListener = null;

    // Elementos DOM
    const telaInicio = document.getElementById('tela-inicio');
    const telaLobby = document.getElementById('tela-lobby');
    const telaJogo = document.getElementById('tela-jogo');
    const codigoEl = document.getElementById('codigo-sala');
    const statusEl = document.getElementById('status');
    const tabuleiroEl = document.getElementById('tabuleiro');
    const placarX = document.getElementById('placar-x');
    const placarO = document.getElementById('placar-o');
    const placarE = document.getElementById('placar-e');
    const modal = document.getElementById('modal');
    const modalTitulo = document.getElementById('modal-titulo');
    const erroEl = document.getElementById('erro');
    const erroJogoEl = document.getElementById('erro-jogo');
    const statusConexao = document.getElementById('status-conexao');

    function criarCelulas() {
      tabuleiroEl.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const cel = document.createElement('div');
        cel.className = 'celula';
        cel.dataset.index = i;
        cel.addEventListener('click', () => jogar(i));
        tabuleiroEl.appendChild(cel);
      }
    }
    criarCelulas();

    function gerarCodigo() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }

    function mostrarTela(tela) {
      [telaInicio, telaLobby, telaJogo].forEach(t => t.classList.remove('ativa'));
      tela.classList.add('ativa');
    }

    function mostrarErro(msg, elemento = erroEl) {
      elemento.textContent = msg;
      elemento.style.display = 'block';
      setTimeout(() => {
        elemento.style.display = 'none';
      }, 8000);
    }

    // Copiar código
    codigoEl.addEventListener('click', () => {
      navigator.clipboard.writeText(codigoEl.textContent).then(() => {
        const original = statusConexao.textContent;
        statusConexao.textContent = '✅ Código copiado!';
        setTimeout(() => statusConexao.textContent = original, 2500);
      }).catch(() => {
        statusConexao.textContent = 'Código: ' + codigoEl.textContent;
      });
    });

    // Criar sala
    document.getElementById('btn-criar').addEventListener('click', async () => {
      if (!db) {
        mostrarErro('Firebase não inicializado. Verifique o console.');
        return;
      }
      
      const nick = document.getElementById('nick-criar').value.trim() || 'Host';
      const roomId = gerarCodigo();
      currentRoomId = roomId;
      mySymbol = 'X';
      erroEl.style.display = 'none';

      const btn = document.getElementById('btn-criar');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> Criando...';

      try {
        const initialState = {
          host: nick,
          guest: null,
          board: Array(9).fill(null),
          turn: 'X',
          status: 'waiting',
          winner: null,
          winningLine: null,
          scores: { X: 0, O: 0, empates: 0 },
          createdAt: serverTimestamp()
        };

        await set(ref(db, 'rooms/' + roomId), initialState);
        
        // Configurar desconexão
        const presenceRef = ref(db, 'rooms/' + roomId);
        onDisconnect(presenceRef).remove();

        codigoEl.textContent = roomId;
        statusConexao.textContent = 'Aguardando oponente conectar...';
        mostrarTela(telaLobby);
        
        // Iniciar listener
        ouvirSala(roomId);
        
        // Timeout de segurança
        setTimeout(() => {
          if (statusConexao.textContent.includes('Aguardando')) {
            statusConexao.innerHTML += '<br><small style="color:var(--muted)">Dica: Compartilhe o código acima</small>';
          }
        }, 5000);
        
      } catch (error) {
        console.error('Erro ao criar sala:', error);
        if (error.code === 'permission-denied') {
          mostrarErro('❌ PERMISSÃO NEGADA! Configure o Realtime Database em "Test Mode" no console do Firebase.');
        } else {
          mostrarErro('Erro ao criar sala: ' + error.message);
        }
        btn.disabled = false;
        btn.innerHTML = '⚡ Criar Sala';
      }
    });

    // Entrar na sala
    document.getElementById('btn-entrar').addEventListener('click', async () => {
      if (!db) {
        mostrarErro('Firebase não inicializado.');
        return;
      }
      
      const nick = document.getElementById('nick-entrar').value.trim() || 'Guest';
      const roomId = document.getElementById('codigo-input').value.trim().toUpperCase();
      erroEl.style.display = 'none';
      
      if (roomId.length !== 4) {
        mostrarErro('O código deve ter exatamente 4 caracteres.');
        return;
      }

      const btn = document.getElementById('btn-entrar');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> Entrando...';

      try {
        const snapshot = await get(ref(db, 'rooms/' + roomId));
        
        if (!snapshot.exists()) {
          mostrarErro('Sala "' + roomId + '" não encontrada. Verifique o código.');
          btn.disabled = false;
          btn.innerHTML = ' Entrar na Sala';
          return;
        }
        
        const data = snapshot.val();
        
        if (data.status !== 'waiting') {
          mostrarErro('Sala já está em jogo ou cheia.');
          btn.disabled = false;
          btn.innerHTML = '🚀 Entrar na Sala';
          return;
        }

        currentRoomId = roomId;
        mySymbol = 'O';

        await update(ref(db, 'rooms/' + roomId), {
          guest: nick,
          status: 'playing',
          startedAt: serverTimestamp()
        });

        // Configurar desconexão do guest
        onDisconnect(ref(db, 'rooms/' + roomId)).update({
          guest: null,
          status: 'waiting',
          board: Array(9).fill(null),
          turn: 'X',
          winner: null,
          winningLine: null
        });

        mostrarTela(telaJogo);
        ouvirSala(roomId);
        
      } catch (error) {
        console.error('Erro ao entrar:', error);
        if (error.code === 'permission-denied') {
          mostrarErro('❌ PERMISSÃO NEGADA! Ative o "Test Mode" no Realtime Database.');
        } else {
          mostrarErro('Erro ao entrar: ' + error.message);
        }
        btn.disabled = false;
        btn.innerHTML = '🚀 Entrar na Sala';
      }
    });

    // Cancelar sala
    document.getElementById('btn-cancelar').addEventListener('click', () => {
      if (currentRoomId && db) {
        remove(ref(db, 'rooms/' + currentRoomId)).catch(console.error);
      }
      location.reload();
    });

    // Ouvir mudanças na sala
    function ouvirSala(roomId) {
      if (!db) return;
      
      salaListener = onValue(ref(db, 'rooms/' + roomId), (snapshot) => {
        const data = snapshot.val();
        
        if (!data) {
          if (currentRoomId && mySymbol === 'O') {
            alert('O Host saiu da sala.');
            location.reload();
          }
          return;
        }

        gameData = data;

        if (data.status === 'waiting') {
          if (data.guest) {
            statusConexao.textContent = `✅ ${data.guest} conectou-se! Iniciando...`;
            setTimeout(() => {
              if (telaLobby.classList.contains('ativa')) {
                mostrarTela(telaJogo);
              }
            }, 1500);
          } else {
            statusConexao.textContent = 'Aguardando oponente conectar...';
          }
        } else if (data.status === 'playing' || data.status === 'finished') {
          if (telaLobby.classList.contains('ativa')) {
            mostrarTela(telaJogo);
          }
          renderizarJogo(data);
        }
      }, (error) => {
        console.error('Erro no listener:', error);
        if (error.code === 'permission-denied') {
          mostrarErro('❌ Erro de permissão no Firebase. Vá ao Console > Realtime Database > Regras e ative "Test Mode"', erroJogoEl);
        }
      });
    }

    function renderizarJogo(data) {
      // Atualizar placar
      placarX.textContent = data.scores?.X || 0;
      placarO.textContent = data.scores?.O || 0;
      placarE.textContent = data.scores?.empates || 0;

      // Atualizar tabuleiro
      for (let i = 0; i < 9; i++) {
        const cel = tabuleiroEl.children[i];
        const valor = data.board[i];
        const estaOcupada = cel.classList.contains('ocupada');

        if (valor && !estaOcupada) {
          cel.classList.add('ocupada');
          cel.innerHTML = '';
          cel.appendChild(criarSVGPeça(valor, true));
          if (valor !== mySymbol) tocarClick();
        } else if (!valor && estaOcupada) {
          cel.classList.remove('ocupada');
          cel.innerHTML = '';
        }
      }

      // Destacar vitória
      document.querySelectorAll('.celula').forEach(c => c.classList.remove('vencedora'));
      if (data.status === 'finished' && data.winningLine) {
        data.winningLine.forEach(idx => {
          tabuleiroEl.children[idx].classList.add('vencedora');
        });
        if (!modalMostrado) {
          modalMostrado = true;
          explodirParticulas();
          setTimeout(mostrarModalFim, 1000);
        }
      }

      // Atualizar status
      if (data.status === 'playing') {
        if (data.turn === mySymbol) {
          statusEl.textContent = '🎯 SUA VEZ';
          statusEl.style.color = mySymbol === 'X' ? 'var(--cyan)' : 'var(--magenta)';
          tabuleiroEl.querySelectorAll('.celula').forEach(c => c.classList.remove('bloqueada'));
        } else {
          statusEl.textContent = '⏳ AGUARDANDO O OPONENTE...';
          statusEl.style.color = 'var(--muted)';
          tabuleiroEl.querySelectorAll('.celula').forEach(c => c.classList.add('bloqueada'));
        }
      }
    }

    function jogar(index) {
      if (!gameData || gameData.status !== 'playing') return;
      if (gameData.turn !== mySymbol) return;
      if (gameData.board[index] !== null) return;

      const novoBoard = [...gameData.board];
      novoBoard[index] = mySymbol;
      const proximoTurno = mySymbol === 'X' ? 'O' : 'X';

      const resultado = verificarVitoria(novoBoard);
      const atualizacao = { board: novoBoard, turn: proximoTurno };

      if (resultado) {
        atualizacao.status = 'finished';
        atualizacao.winner = resultado.vencedor;
        atualizacao.winningLine = resultado.linha;
        if (resultado.vencedor === 'empate') {
          atualizacao['scores/empates'] = (gameData.scores.empates || 0) + 1;
        } else {
          atualizacao[`scores/${resultado.vencedor}`] = (gameData.scores[resultado.vencedor] || 0) + 1;
        }
      }

      update(ref(db, 'rooms/' + currentRoomId), atualizacao).catch(err => {
        console.error("Erro ao jogar:", err);
        if (err.code === 'permission-denied') {
          mostrarErro('❌ Erro de permissão ao salvar jogada', erroJogoEl);
        }
      });
    }

    function verificarVitoria(board) {
      const linhas = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];
      for (const combo of linhas) {
        const [a, b, c] = combo;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return { vencedor: board[a], linha: combo };
        }
      }
      if (board.every(c => c !== null)) return { vencedor: 'empate', linha: null };
      return null;
    }

    function mostrarModalFim() {
      if (gameData.winner === 'empate') {
        modalTitulo.textContent = 'EMPATE!';
        modalTitulo.className = 'empate';
      } else if (gameData.winner === mySymbol) {
        modalTitulo.textContent = 'VITÓRIA!';
        modalTitulo.className = 'vitoria';
      } else {
        modalTitulo.textContent = 'DERROTA';
        modalTitulo.className = '';
      }
      modal.classList.add('ativo');
    }

    document.getElementById('btn-revanche').addEventListener('click', () => {
      modal.classList.remove('ativo');
      modalMostrado = false;
      
      update(ref(db, 'rooms/' + currentRoomId), {
        board: Array(9).fill(null),
        turn: gameData.turn === 'X' ? 'O' : 'X',
        status: 'playing',
        winner: null,
        winningLine: null
      }).catch(console.error);
    });

    document.getElementById('btn-sair').addEventListener('click', () => {
      if (currentRoomId && db) {
        if (mySymbol === 'X') {
          remove(ref(db, 'rooms/' + currentRoomId));
        } else {
          update(ref(db, 'rooms/' + currentRoomId), {
            guest: null,
            status: 'waiting',
            board: Array(9).fill(null),
            turn: 'X',
            winner: null,
            winningLine: null
          });
        }
      }
      location.reload();
    });

    function criarSVGPeça(simbolo, animar) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.classList.add('peca', simbolo);
      if (animar) svg.classList.add('animar');

      if (simbolo === 'X') {
        const l1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        l1.setAttribute('x1', 20); l1.setAttribute('y1', 20); l1.setAttribute('x2', 80); l1.setAttribute('y2', 80);
        const l2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        l2.setAttribute('x1', 80); l2.setAttribute('y1', 20); l2.setAttribute('x2', 20); l2.setAttribute('y2', 80);
        svg.appendChild(l1); svg.appendChild(l2);
      } else {
        const circ = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circ.setAttribute('cx', 50); circ.setAttribute('cy', 50); circ.setAttribute('r', 30);
        svg.appendChild(circ);
      }
      return svg;
    }

    function explodirParticulas() {
      const cores = ['var(--gold)', 'var(--cyan)', 'var(--magenta)'];
      const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
      for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'particula';
        const ang = (Math.PI * 2 * i) / 40;
        const dist = 100 + Math.random() * 200;
        p.style.left = cx + 'px'; p.style.top = cy + 'px';
        p.style.background = cores[i % 3];
        p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
        p.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
        p.style.boxShadow = `0 0 10px ${cores[i % 3]}`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1000);
      }
    }

    function tocarClick() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 800;
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        osc.start(); osc.stop(ctx.currentTime + 0.1);
      } catch(e) {}
    }

    // Limpar listener ao sair
    window.addEventListener('beforeunload', () => {
      if (salaListener && db) {
        // Firebase limpa automaticamente com onDisconnect
      }
    });
  </script>
</body>
