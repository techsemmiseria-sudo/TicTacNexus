<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b18">
<title>TIC TAC NEXUS — Jogo da Velha Online</title>

<style>
:root {
  --bg:#080b18; --panel:#11172ecc; --line:#a5beff29;
  --text:#f4f7ff; --muted:#8993b2; --cyan:#36d9ff;
  --aqua:#00ffe1; --purple:#9b5cff; --pink:#ff4f81;
  --green:#62f3b0;
}
* { box-sizing:border-box }
[hidden] { display:none!important }
body {
  min-height:100vh; margin:0; overflow-x:hidden; color:var(--text);
  background:radial-gradient(ellipse at 65% 25%,#39207d40,transparent 36rem),var(--bg);
  font:14px Arial,sans-serif;
}
button,input { font:inherit }
button { cursor:pointer }
button:focus-visible,input:focus-visible { outline:2px solid var(--cyan); outline-offset:3px }
.top,main { width:min(1200px,calc(100% - 36px)); margin:auto }
.top { height:76px; display:flex; align-items:center; justify-content:space-between }
.logo { font-weight:bold; letter-spacing:.13em }
.logo b { color:var(--cyan) }
.status { color:var(--muted); font-size:10px; font-weight:bold; letter-spacing:.1em; text-transform:uppercase }
.status i { display:inline-block; width:7px; height:7px; margin-right:7px; border-radius:50%; background:var(--pink) }
.status.online { color:var(--green) }
.status.online i { background:var(--green) }
.status.connecting i { background:#ffd166 }
.sound { margin-left:16px; width:36px; height:36px; border:1px solid var(--line); border-radius:50%; color:var(--muted); background:#ffffff08 }
.home { min-height:calc(100vh - 76px); display:grid; grid-template-columns:1fr minmax(320px,440px); align-items:center; gap:clamp(35px,8vw,120px); padding:25px 4% 65px }
.eyebrow { color:var(--cyan); font-size:10px; font-weight:bold; letter-spacing:.18em }
.hero h1 { margin:20px 0; font-size:clamp(50px,7vw,86px); line-height:.95; letter-spacing:-.06em }
.hero h1 em { color:var(--cyan); font-style:normal; text-shadow:0 0 28px #36d9ff66 }
.hero p { max-width:460px; color:var(--muted); line-height:1.8 }
.features { display:flex; flex-wrap:wrap; gap:16px; margin-top:28px; color:var(--muted); font-size:10px; font-weight:bold; text-transform:uppercase }
.features b { color:var(--cyan) }
.card { position:relative; border:1px solid var(--line); border-radius:17px; background:linear-gradient(145deg,#171d39dd,#0a0e1edb); box-shadow:0 24px 70px #0007; backdrop-filter:blur(14px) }
.lobby { padding:28px; overflow:hidden }
.lobby:before,.waiting-card:before { content:""; position:absolute; top:0; left:15%; right:15%; height:1px; background:linear-gradient(90deg,transparent,var(--cyan),transparent) }
.meta,.panel-head { display:flex; align-items:center; justify-content:space-between }
.live { color:var(--green); font-size:9px; font-weight:bold; letter-spacing:.1em }
.lobby h2 { margin:30px 0 7px; font-size:27px }
.sub { margin:0 0 24px; color:var(--muted); font-size:12px }
.form { display:flex; flex-direction:column; gap:9px }
.label { color:#c3cce5; font-size:10px; font-weight:bold }
.input { height:48px; display:flex; align-items:center; border:1px solid var(--line); border-radius:9px; background:#[05081799](05081799) }
.input span { width:40px; text-align:center; color:#7784a5 }
.input input { min-width:0; flex:1; height:100%; border:0; outline:0; color:var(--text); background:transparent }
.input input::placeholder { color:#65708d }
.code { text-transform:uppercase; letter-spacing:.25em }
.primary,.secondary { min-height:46px; display:flex; align-items:center; justify-content:space-between; padding:0 15px; border-radius:9px; font-size:11px; font-weight:bold; transition:.2s }
.primary { border:1px solid #36d9ff99; color:#03101b; background:linear-gradient(100deg,var(--cyan),var(--aqua)) }
.secondary { border:1px solid #36d9ff55; color:var(--cyan); background:#36d9ff0e }
.primary:hover,.secondary:hover { transform:translateY(-2px) }
.divider { display:flex; align-items:center; gap:10px; margin:22px 0; color:var(--muted); font-size:9px; text-transform:uppercase; white-space:nowrap }
.divider:before,.divider:after { content:""; height:1px; flex:1; background:var(--line) }
.privacy { margin:22px 0 0; text-align:center; color:var(--muted); font-size:9px }
.page-title { padding-top:40px; text-align:center }
.page-title h1 { margin:12px 0 8px; font-size:clamp(30px,5vw,46px) }
.page-title p { color:var(--muted); font-size:13px }
.waiting-card { width:min(100%,470px); margin:28px auto 60px; padding:32px; text-align:center }
.room-label { color:var(--muted); font-size:9px; font-weight:bold; letter-spacing:.15em }
.room-code { margin:13px 0 0; border:0; color:var(--cyan); background:none; font-size:clamp(40px,9vw,58px); font-weight:bold; letter-spacing:.16em; text-shadow:0 0 24px #36d9ff66 }
.hint { color:var(--muted); font-size:10px }
.orbit { height:120px; display:grid; place-items:center; position:relative }
.orbit:before { content:""; position:absolute; width:150px; height:62px; border:1px solid #36d9ff44; border-radius:50%; transform:rotate(-20deg); animation:spin 8s linear infinite }
.core { width:70px; height:70px; display:grid; place-items:center; border:1px solid #36d9ff88; border-radius:50%; color:var(--cyan); background:#36d9ff12; font-size:25px; font-weight:bold; box-shadow:0 0 28px #36d9ff33; animation:float 3s ease-in-out infinite }
.slots { display:grid; grid-template-columns:1fr 1fr; gap:9px }
.slot { min-height:50px; display:flex; align-items:center; gap:9px; padding:8px; border:1px solid var(--line); border-radius:8px; text-align:left; font-size:10px }
.slot.empty { border-style:dashed; color:var(--muted) }
.symbol { width:28px; height:28px; display:grid; place-items:center; border-radius:7px; color:var(--cyan); background:#36d9ff18; font-weight:bold }
.slot:nth-child(2) .symbol { color:var(--purple); background:#9b5cff1c }
.waiting-msg { min-height:20px; margin:18px 0; color:var(--muted); font-size:11px }
.actions { display:grid; gap:9px }
.text-button { border:0; color:var(--muted); background:none; font-size:10px }
.text-button:hover { color:var(--pink) }
.game { padding:36px 0 65px }
.game-head { display:flex; align-items:end; justify-content:space-between; gap:14px; margin-bottom:28px }
.game-head h1 { margin:8px 0 0; font-size:clamp(27px,4vw,44px) }
.game-actions { display:flex; align-items:center; gap:12px }
.mini { padding:9px; border:1px solid var(--line); border-radius:7px; color:var(--muted); background:#ffffff08; font-size:9px }
.mini strong { color:var(--cyan); letter-spacing:.15em }
.game-grid { display:grid; grid-template-columns:200px minmax(280px,500px) 200px; justify-content:space-between; align-items:start; gap:22px; max-width:1000px; margin:auto }
.side { min-height:230px; padding:18px 15px }
.panel-head { color:var(--muted); font-size:9px; font-weight:bold; letter-spacing:.12em }
.players { display:grid; gap:8px; margin-top:20px }
.player { display:flex; align-items:center; gap:8px; padding:8px; border:1px solid transparent; border-radius:8px; background:#ffffff07 }
.player.current { border-color:#36d9ff66 }
.player-info { min-width:0; display:grid; gap:3px }
.player-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:10px; font-weight:bold }
.player-status { color:var(--muted); font-size:8px }
.round,.draws { display:flex; justify-content:space-between; margin-top:22px; padding-top:14px; border-top:1px solid var(--line); color:var(--muted); font-size:9px }
.round strong,.draws strong { color:var(--text); font-size:17px }
.score { display:flex; align-items:center; gap:9px; margin-top:20px }
.score-info { min-width:0; display:flex; flex:1; align-items:center; justify-content:space-between; gap:5px }
.score-info small { overflow:hidden; color:var(--muted); font-size:9px; text-overflow:ellipsis; white-space:nowrap }
.score-info strong { font-size:22px }
.score .o { color:var(--purple); background:#9b5cff1b }
.vs { margin-top:12px; text-align:center; color:var(--muted); font-size:8px }
.board-wrap { text-align:center }
.turn { display:inline-block; margin:0 0 13px; padding:7px 12px; border:1px solid #36d9ff55; border-radius:30px; color:var(--cyan); background:#36d9ff0d; font-size:10px; font-weight:bold; text-transform:uppercase }
.turn.off { color:var(--muted); border-color:var(--line) }
.board { width:min(100%,480px); aspect-ratio:1; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:auto; padding:8px; border:1px solid var(--line); border-radius:16px; background:#[05081799](05081799) }
.cell { display:grid; place-items:center; border:1px solid #859de733; border-radius:10px; color:var(--text); background:#121936ad }
.cell:hover:not(:disabled) { border-color:var(--cyan); background:#36d9ff12 }
.cell:disabled { cursor:not-allowed }
.mark { font-size:clamp(42px,10vw,78px); font-weight:bold; animation:pop .25s ease }
.x .mark { color:var(--cyan); text-shadow:0 0 22px #36d9ff77 }
.o .mark { color:var(--purple); text-shadow:0 0 22px #9b5cff77 }
.winner { border-color:var(--aqua); background:#00ffe11c; box-shadow:0 0 24px #00ffe155 }
.draw { border-color:#9b5cff66 }
.message { min-height:22px; color:var(--muted); font-size:11px }
